[build-system]
# setuptools 77 is the first version that understands the SPDX licence expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name of the fork. The import name stays `PyFWI`, so that scripts written for
# PyFWI 0.1.10 run unchanged. Both distributions provide the `PyFWI` package, so they must not be
# installed in the same environment (`pip uninstall PyFWI` first).
name = "pyfwi-cuda"
dynamic = ["version"]  # read from src/PyFWI/version.py (see [tool.setuptools.dynamic])
description = "PyFWI with a CUDA backend: elastic full-waveform inversion and reservoir monitoring on NVIDIA GPUs"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    # Authors of PyFWI (setup.py of 0.1.10 and the SoftwareX paper).
    { name = "Amir Mardan", email = "mardan.amir.h@gmail.com" },
    { name = "Bernard Giroux" },
    { name = "Gabriel Fabien-Ouellet" },
]
maintainers = [{ name = "Gabriel Carvalho" }]  # of the fork
keywords = ["seismic", "full-waveform inversion", "FWI", "time-lapse", "OpenCL", "CUDA", "GPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# What PyFWI needs to run. 0.1.10 forgot pyopencl (only in build-system.requires) and listed
# setuptools, wheel and datetime, which are not runtime dependencies ("datetime" on PyPI is an
# unrelated Zope package; PyFWI uses the standard-library module).
dependencies = [
    "numpy",
    "scipy",        # optimisers (fwi, tl_fwi, optimization) and filters
    "matplotlib",   # seiplot
    "hdf5storage",  # .mat files (seismic_io, model_dataset)
    "requests",     # download of the Marmousi model (model_dataset)
    "pyopencl",     # the OpenCL engine (wave_propagation)
]

[project.optional-dependencies]
segy = ["segyio"]  # reading SEG-Y files: seismic_io.read_segy and the Marmousi model of model_dataset
torch = ["torch"]  # PyFWI.torchfwi (gradients through PyTorch) and PyFWI.torch
# The CUDA backend (PYFWI_BACKEND=cuda): CuPy with the CUDA toolkit from PyPI ([ctk]: runtime and
# NVRTC), so that no system CUDA Toolkit is needed, only an NVIDIA driver. [cuda13] needs a driver
# for CUDA 13 (580 or newer); [cuda12] one for CUDA 12 (525 or newer, 580 included).
cuda13 = ["cupy-cuda13x[ctk]>=14"]
cuda12 = ["cupy-cuda12x[ctk]>=14"]

[project.urls]
Source = "https://github.com/obb199/pyfwi-cuda"
Changelog = "https://github.com/obb199/pyfwi-cuda/blob/main/CHANGELOG.md"
"Original project" = "https://github.com/AmirMardan/PyFWI"
"Original documentation" = "https://pyfwi.readthedocs.io"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]  # finds PyFWI and its subpackage PyFWI.torch

[tool.setuptools.package-data]
# Files that are not Python modules: the OpenCL kernels, the rock-physics data of model_dataset
# (the "dupuy" model) and the header that lets CUDA compile the kernels. 0.1.10 shipped the kernels only.
PyFWI = ["*.cl", "data/*.mat", "kernels/*.h"]

[tool.setuptools.dynamic]
version = { attr = "PyFWI.version.version" }

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "gpu: needs an NVIDIA GPU with CuPy and cuda.core",
    "opencl: needs the NVIDIA OpenCL platform",
    "slow: takes minutes; excluded from the fast suite (pytest -m 'not slow') and run before commits and at gates",
]

[tool.ruff]
# `ruff check .` applies the full default rule set to the code written for the fork.
# The code inherited from PyFWI 0.1.10 is listed file by file below (a glob such as
# "src/PyFWI/*.py" would also exclude new subpackages) and is only checked for critical
# errors (syntax errors, undefined names), as the original CI did with flake8:
#   ruff check --isolated --select E9,F63,F7,F82 --line-length 127 .
# When an inherited file is rewritten for the fork, remove it from this list.
line-length = 127
target-version = "py310"
extend-exclude = [
    "docs/conf.py",
    "example/fwi_example_surface.py",
    "example/*.ipynb",
    "test/test_ricker.py",
    "src/PyFWI/acquisition.py",
    "src/PyFWI/fwi.py",
    "src/PyFWI/fwi_tools.py",
    "src/PyFWI/grad_switcher.py",
    "src/PyFWI/model_dataset.py",
    "src/PyFWI/optimization.py",
    "src/PyFWI/processing.py",
    "src/PyFWI/rock_physics.py",
    "src/PyFWI/seiplot.py",
    "src/PyFWI/seismic_io.py",
    "src/PyFWI/tl_fwi.py",
    "src/PyFWI/torchfwi.py",
    "src/PyFWI/version.py",
    "src/PyFWI/wave_propagation.py",
    "src/PyFWI/torch/wave_propagation.py",
]

[tool.ruff.lint.per-file-ignores]
# N999 (invalid module name): the import name PyFWI is inherited and public, so it cannot follow
# the lower-case convention in new modules of the package either.
"src/PyFWI/**/__init__.py" = ["N999"]

[tool.ruff.lint.isort]
# Modules of this repository, imported from the tests (test/ is on sys.path under pytest).
known-first-party = ["PyFWI", "tools", "helpers", "oob_guard", "conftest", "fake_backend", "golden_cases", "golden_runner", "golden_store"]
