[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "numpy",
    "pyopencl",
    "matplotlib",
    "scipy",
    "hdf5storage",
    "requests",
    "datetime",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "gpu: precisa de GPU NVIDIA com CuPy e cuda.core",
    "opencl: precisa de uma plataforma OpenCL NVIDIA",
]
