# Continuous integration of the PyFWI-CUDA fork.
#
# Job "cpu" runs on a GitHub-hosted Ubuntu machine, which has no NVIDIA GPU:
#   1. lint: critical errors on the whole repository (inherited code included) and the
#      full rule set on the fork's own code (configuration in pyproject.toml);
#   2. environment check without GPU (OpenCL on the CPU through POCL);
#   3. the test suite; tests that need the RTX (markers gpu and opencl) skip themselves;
#   4. packaging: the wheel installed in a fresh environment, with its dependencies resolved
#      from PyPI as a user gets them (not from the pinned file), must import completely.
# GPU jobs (parity, compute-sanitizer, benchmarks) will run on a self-hosted runner on the
# RTX machine (docs/cuda-migration/execution-roadmap.md, step 0.9).
#
# This workflow never publishes anything: test/test_ci.py fails if any workflow does.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU - lint, environment check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # test_docs.py checks that the commits cited in the docs exist

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-cpu.txt

      - name: Install the pinned CPU dependencies and the fork (editable)
        run: |
          python -m pip install -r requirements/ci-cpu.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint - critical errors in the whole repository
        run: ruff check --isolated --select E9,F63,F7,F82 --line-length 127 .

      - name: Lint - full rules on the fork's own code
        run: ruff check .

      - name: Environment check without GPU
        run: python tools/check_env.py --no-gpu --skip-pyfwi

      - name: Test suite
        run: python -m pytest -m "not slow" -ra

      - name: Packaging - install the wheel in a fresh environment and check it
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/pyfwi_cuda-*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/clean/bin/python" "$GITHUB_WORKSPACE/tools/check_install.py"
